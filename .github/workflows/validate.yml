name: Validate static site

on:
  push:
    branches: [copilot-suggested-profile, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install HTML validator
        run: python -m pip install --upgrade html5validator

      - name: Validate HTML
        run: html5validator --root .

      - name: Check internal links and assets
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "./**/*.html"
          fail: true
